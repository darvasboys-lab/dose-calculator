
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGICH ALL Maintenance Calculator</title>

<style>
/*
 * PGICH ALL — Premium Minimal UI (v6)
 * Visual styles only; calculation, saving, and safety logic unchanged.
 * Optimised for narrow Google Sheets sidebars and mobile screens.
 */
:root {
  color-scheme: light;
  --blue: #166ca8;
  --blue-deep: #115d94;
  --blue-soft: #eaf3fa;
  --green: #18734c;
  --red: #b42c37;
  --ink: #1d3043;
  --muted: #728193;
  --gold: #916c2f;
  --canvas: #f5f7fa;
  --surface: #ffffff;
  --stroke: #e6ebf1;
  --ring: rgba(34,119,183,.18);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #f8fafc 0%, var(--canvas) 45%, #f1f4f8 100%);
  color: var(--ink);
  font: 14.5px/1.46 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: -.006em;
  -webkit-font-smoothing: antialiased;
}

main {
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  padding: 18px 16px max(28px, env(safe-area-inset-bottom));
}

/* Restrained, spacious heading */
header {
  padding: 12px 5px 16px;
  color: var(--ink);
  background: transparent;
  border: 0;
  box-shadow: none;
}

h1 {
  margin: 0;
  font-size: clamp(20px, 3vw, 23px);
  line-height: 1.22;
  font-weight: 740;
  letter-spacing: -.045em;
}

header::after {
  display: block;
  content: "";
  width: 34px;
  height: 3px;
  margin-top: 13px;
  border-radius: 99px;
  background: linear-gradient(90deg, #9b753b, #d8b978);
}

h2 {
  margin: 0 0 22px;
  color: #24384b;
  font-size: 17px;
  line-height: 1.3;
  letter-spacing: -.025em;
  font-weight: 725;
}

/* iOS-style segmented navigation, without altering tab logic */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 3px;
  padding: 5px;
  margin: 0 0 14px;
  background: #e9edf2;
  border: 1px solid #e2e8ef;
  border-radius: 15px;
  box-shadow: inset 0 1px 2px rgba(23,48,70,.035);
}

.tab {
  appearance: none;
  min-width: 0;
  min-height: 43px;
  border: 0;
  border-radius: 11px;
  padding: 8px 3px;
  background: transparent;
  color: #617387;
  font: inherit;
  font-size: 11.5px;
  font-weight: 680;
  line-height: 1.15;
  letter-spacing: -.018em;
  white-space: nowrap;
  transition: background .16s ease, box-shadow .16s ease, color .16s ease;
}

.tab.active {
  color: #194261;
  background: var(--surface);
  box-shadow: 0 2px 7px rgba(20,45,67,.085), 0 1px 1px rgba(20,45,67,.05);
}

/* A single proportionate card per tab */
section {
  margin: 0 0 14px;
  padding: 23px 22px 19px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: 21px;
  box-shadow: 0 9px 30px rgba(32,52,73,.045), 0 2px 6px rgba(32,52,73,.02);
}

section[hidden] { display: none !important; }

.stack {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}

.field-label {
  color: #394b5e;
  font-size: 13.5px;
  font-weight: 680;
  letter-spacing: -.01em;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

/* Fields — consistent dimensions, soft neutral borders */
input:not([type=range]):not([type=checkbox]):not([type=hidden]) {
  appearance: none;
  width: 100%;
  min-width: 0;
  height: 50px;
  padding: 10px 13px;
  border: 1px solid #dbe3eb;
  border-radius: 12px;
  outline: none;
  background: #fbfcfe;
  color: var(--ink);
  font: 620 16px/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  transition: border-color .15s ease, box-shadow .15s ease;
}

input:not([type=range]):not([type=checkbox]):not([type=hidden]):focus {
  border-color: #5b9fc9;
  box-shadow: 0 0 0 3px var(--ring);
}

/* Number stepper buttons already exist; hide the browser's extra arrows */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] { -moz-appearance: textfield; }

/* Body-measurement sliders */
input[type=range] {
  width: 100%;
  min-width: 0;
  height: 32px;
  margin: 0;
  padding: 0;
  border: 0;
  accent-color: var(--blue);
  cursor: pointer;
}

.rangeLine {
  display: flex;
  align-items: center;
  gap: 13px;
}

.rangeLine input[type=range] {
  flex: 1 1 auto;
}

.rangeLine input[type=number] {
  flex: 0 0 84px;
  width: 84px;
  height: 48px;
  padding: 8px 7px;
  text-align: center;
}

/* Compact numeric stepper — matching vertical proportions */
.stepper {
  display: grid;
  grid-template-columns: minmax(48px,.9fr) minmax(96px,1.58fr) minmax(48px,.9fr);
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 302px;
  margin: 2px auto 0;
}

.stepper input[type=number] {
  width: 100%;
  min-width: 0;
  height: 54px;
  padding: 6px 4px;
  border: 1.5px solid #d8e1eb;
  border-radius: 13px;
  background: #ffffff;
  font-size: 22px;
  font-weight: 760;
  line-height: 1.2;
  letter-spacing: -.035em;
  text-align: center;
  box-shadow: 0 2px 5px rgba(38,65,90,.035);
}

.stepper button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 60px;
  min-height: 60px;
  padding: 0 0 3px;
  border: 1px solid #dceaf6;
  border-radius: 15px;
  background: var(--blue-soft);
  color: var(--blue-deep);
  font-size: 36px;
  font-weight: 480;
  line-height: 1;
  transition: background .15s ease, transform .12s ease;
}

.stepper button:active { background: #d9eaf7; }

/* Keep the lab labels visually aligned with the centered controls */
.field:has(> .stepper) > .field-label {
  text-align: center;
}

/* Two- and three-way pill-like choice buttons */
.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 9px;
}

.choices.three { grid-template-columns: repeat(3, minmax(0,1fr)); }

.choice {
  appearance: none;
  min-width: 0;
  min-height: 50px;
  padding: 9px 7px;
  border: 1.5px solid #dce4ec;
  border-radius: 13px;
  background: #f9fbfd;
  color: #5a6d7e;
  font: inherit;
  font-size: 13px;
  font-weight: 670;
  letter-spacing: -.01em;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}

.choice.selected.good {
  background: #eaf6ee;
  border-color: #96ceb0;
  color: #14643f;
}

.choice.selected.bad {
  background: #fff0f0;
  border-color: #e7a0a5;
  color: #9c2832;
}

.choice.selected.neutral {
  background: #fff6e5;
  border-color: #e7c17d;
  color: #926c27;
}

button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:active { transform: scale(.987); }
button:disabled { opacity: .48; cursor: not-allowed; }

button:focus-visible,
input[type=range]:focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
}

/* Clear hierarchy: filled primary action, quiet secondary action */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 25px;
}

.action {
  flex: 1 1 120px;
  min-height: 48px;
  padding: 12px 15px;
  border: 1px solid transparent;
  border-radius: 13px;
  background: var(--blue);
  color: #ffffff;
  font: inherit;
  font-size: 13px;
  font-weight: 720;
  letter-spacing: -.012em;
  box-shadow: 0 3px 9px rgba(24,92,145,.1);
}

.action.secondary {
  background: #eef3f8;
  border-color: #e5ecf3;
  box-shadow: none;
  color: #49657d;
}

.action[hidden] { display: none !important; }

/* Small BSA information tile */
.bsa {
  padding: 13px 15px;
  border: 1px solid #e0ebf4;
  border-radius: 13px;
  background: #f2f7fb;
  color: #335b78;
  font-size: 13.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* Toxicity remains unmistakable despite a subdued overall visual style */
.stop-alert {
  margin-bottom: 14px;
  padding: 15px;
  border: 1.5px solid #df8c92;
  border-left: 4px solid var(--red);
  border-radius: 14px;
  background: #fff2f2;
  color: #8b252d;
  font-size: 13px;
  line-height: 1.6;
}
.stop-alert[hidden] { display: none !important; }
.stop-alert strong { display: block; margin-bottom: 8px; font-weight: 780; }
.stop-alert small { display: block; margin-top: 9px; color: #73424b; }

.summary {
  padding: 15px;
  border: 1px solid #e6edf4;
  border-radius: 14px;
  background: #f7f9fc;
  color: #33495d;
  font-size: 13.5px;
  line-height: 1.75;
  white-space: pre-line;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

#result { display: none; }

#message {
  margin: 9px 2px 0;
  min-height: 0;
  color: #506b80;
  font-size: 12.5px;
  font-weight: 620;
  line-height: 1.5;
}

#message:empty { display: none; }

.save-state {
  margin-top: 13px;
  color: #17724b;
  font-size: 12.5px;
  font-weight: 690;
  line-height: 1.5;
}

.save-state.unsaved { color: var(--red); }

/* Small signature in muted deep gold */
.dev-credit {
  margin-top: 26px;
  padding-top: 13px;
  border-top: 1px solid #eff2f6;
  color: var(--gold);
  opacity: .92;
  text-align: center;
  font-size: 10.5px;
  font-weight: 720;
  letter-spacing: .015em;
}

/* Balanced at standard phone and narrow Apps Script sidebar widths */

/* Phone web-app: occupy the complete available screen width.
   Browser address/status bars are controlled by the browser, not this CSS. */
@media (max-width: 767px) {
  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    overflow-x: clip;
  }
  body {
    background: #f5f7fa;
  }
  main {
    width: 100%;
    max-width: none;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(22px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }
  header,
  .tabs,
  form,
  form > section,
  #result {
    width: 100%;
    max-width: none;
    min-width: 0;
  }
  header {
    padding: 14px 6px 18px;
  }
  section {
    border-radius: 18px;
  }
  .stack, .field, .rangeLine {
    min-width: 0;
  }
  .tabs {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (max-width: 430px) {
  main { padding: max(10px, env(safe-area-inset-top)) max(7px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(7px, env(safe-area-inset-left)); }
  header { padding: 12px 7px 15px; }
  h1 { font-size: 20px; }
  section { padding: 20px 16px 18px; border-radius: 19px; }
  h2 { font-size: 16.5px; margin-bottom: 19px; }
  .stack { gap: 20px; }
  .tabs { gap: 2px; padding: 4px; border-radius: 13px; }
  .tab { min-height: 42px; padding: 7px 1px; font-size: 10.5px; }
  .stepper { max-width: 288px; gap: 8px; }
  .stepper button { height: 58px; min-height: 58px; font-size: 35px; }
  .stepper input[type=number] { height: 52px; font-size: 20px; }
  .rangeLine { gap: 9px; }
  .rangeLine input[type=number] { flex-basis: 76px; width: 76px; }
  .choice { min-height: 49px; font-size: 12.5px; }
  .actions { gap: 8px; margin-top: 22px; }
  .action { min-height: 47px; padding: 11px 10px; font-size: 12.5px; }
}

@media (max-width: 320px) {
  main { padding-inline: 6px; }
  section { padding: 18px 12px; }
  .tab { font-size: 10px; }
  .stepper { gap: 6px; grid-template-columns: minmax(45px,.8fr) minmax(86px,1.6fr) minmax(45px,.8fr); }
  .stepper button { height: 55px; min-height: 55px; font-size: 33px; }
  .stepper input[type=number] { font-size: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

@media print {
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  header, .tabs, form, #message, .actions { display: none !important; }
  #result { display: block !important; border: none; box-shadow: none; }
  .save-state { color: #263c4c; }
}
</style>
</head>

<body>
<main>

<header>
  <h1>PGICH ALL Maintenance Calculator</h1>
</header>

<nav id="tabs" class="tabs"
  aria-label="Calculator tabs">
</nav>

<form id="f" novalidate></form>

<p id="message" role="status"
  aria-live="polite"></p>

<section id="result">
  <h2>Assessment Summary</h2>

  <div id="stopBox" class="stop-alert" hidden role="alert">
    <strong>HARD STOP — AUTOMATED DOSE SUGGESTION BLOCKED</strong>
    <div id="stopReasons"></div>
    <small>This alert blocks the software's dose suggestion; treatment decisions require the oncologist.</small>
  </div>
  <div id="output" class="summary"></div>
  <div id="saveState" class="save-state" role="status" aria-live="polite"></div>
  <ul id="warnings"></ul>

  <div class="actions">
    <button id="save" class="action secondary"
      type="button" hidden disabled>
      Retry save
    </button>

    <button id="print" class="action secondary"
      type="button">
      Print assessment
    </button>
  </div>

  <footer class="dev-credit">
    Developed by — Dr Aman Singh
  </footer>
</section>

</main>

<script>
(function () {
  'use strict';

  const form = document.getElementById('f');
  const tabsBox = document.getElementById('tabs');
  const result = document.getElementById('result');
  const message = document.getElementById('message');
  const output = document.getElementById('output');
  const saveButton = document.getElementById('save');
  const saveState = document.getElementById('saveState');
  const stopBox = document.getElementById('stopBox');
  const stopReasons = document.getElementById('stopReasons');

  const footer = `
    <footer class="dev-credit">
      Developed by — Dr Aman Singh
    </footer>
  `;

  let lastInput = null;
  let version = 0;
  let busy = false;
  let saved = false;
  let saveBusy = false;

  saveButton.disabled = true;
  saveButton.hidden = true;

  /* DEFAULT HEALTHY/NORMAL SELECTIONS */

  // Prefilled UI values only.
  // They are not clinically verified results.

  const defaults = {
    rising:'no',
    fever:'no',
    infection:'no',
    jaundice:'no',
    mucositis:'no',
    tpmt:'normal',
    nudt15:'normal',
    adherence:'good'
  };

  const yesno = [
    ['yes','YES','bad'],
    ['no','NO','good']
  ];

  const genetics = [
    ['normal','Normal','good'],
    ['variant','Variant','bad'],
    ['unknown','Unknown','neutral']
  ];

  /* FIELD GENERATORS */

  function field(label, content) {
    return `
      <div class="field">
        <span class="field-label">${label}</span>
        ${content}
      </div>
    `;
  }

  function slider(
    name,label,min,max,step,val
  ) {
    return field(label, `
      <div class="rangeLine">

        <input type="range"
          data-slider="${name}"
          min="${min}"
          max="${max}"
          step="${step}"
          value="${val}"
          aria-label="${label} slider">

        <input type="number"
          name="${name}"
          min="${min}"
          max="${max}"
          step="any"
          value="${val}"
          required
          aria-label="${label}">
      </div>
    `);
  }

  function plain(name,label,val) {
    return field(label, `
      <input name="${name}"
        type="number"
        min="0"
        max="1000"
        step="any"
        value="${val}"
        required
        aria-label="${label}">
    `);
  }

  function stepper(
    name,label,val,step,max,
    required=true,min=0
  ) {
    return field(label, `
      <div class="stepper" data-step="${step}">

        <button type="button"
          data-delta="-1"
          aria-label="Decrease ${label}">
          −
        </button>

        <input name="${name}"
          type="number"
          inputmode="decimal"
          min="${min}"
          max="${max}"
          step="any"
          value="${val}"
          ${required ? 'required' : ''}
          aria-label="${label}">

        <button type="button"
          data-delta="1"
          aria-label="Increase ${label}">
          +
        </button>

      </div>
    `);
  }

  function choice(name,label,items) {
    const buttons = items.map(item => `
      <button type="button"
        class="choice ${item[2]}"
        data-value="${item[0]}"
        aria-pressed="false">
        ${item[1]}
      </button>
    `).join('');

    return field(label, `
      <div class="choices
        ${items.length === 3 ? 'three' : ''}"
        data-choice="${name}">
        ${buttons}
      </div>

      <input type="hidden"
        name="${name}"
        value="">
    `);
  }

  /* FOUR TABS */

  const pages = [

    /* 1. PATIENT */

    {
      title:'Patient Details',

      content:[
        slider(
          'age','Age (years)',
          0,25,0.5,6
        ),

        slider(
          'height','Height (cm)',
          35,230,1,115
        ),

        slider(
          'weight','Weight (kg)',
          1,200,0.5,20
        ),

        `
          <div class="bsa" id="bsa">
            Estimated BSA: —
          </div>
        `,

        plain(
          'current6',
          'Current 6-MP (mg/day)',
          12
        ),

        plain(
          'currentM',
          'Current MTX (mg/week)',
          12
        ),

        field('CR Number (4 digits)', `
          <input name="demoId"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="off"
            placeholder="0001"
            required>
        `)
      ].join('')
    },

    /* 2. CBC */

    {
      title:'Complete Blood Count',

      content:[
        stepper(
          'wbc','WBC / TLC (/µL)',
          2500,100,200000
        ),

        stepper(
          'anc','ANC (/µL)',
          1000,100,200000
        ),

        stepper(
          'alc','ALC (/µL)',
          900,100,200000
        ),

        stepper(
          'platelets','Platelets (/µL)',
          180000,1000,2000000
        ),

        stepper(
          'prevWbc','Previous WBC (/µL)',
          2600,100,200000,false
        ),

        stepper(
          'prevAnc','Previous ANC (/µL)',
          1050,100,200000,false
        )
      ].join('')
    },

    /* 3. LFT PANEL */

    {
      title:'LFT Panel',

      content:[
        stepper(
          'bilirubin',
          'Total bilirubin (mg/dL)',
          0.8,0.1,100
        ),

        stepper(
          'biliULN',
          'Bilirubin ULN (mg/dL)',
          1,0.1,20,true,0.01
        ),

        stepper(
          'ast',
          'AST / SGOT (U/L)',
          30,5,20000
        ),

        stepper(
          'alt',
          'ALT / SGPT (U/L)',
          30,5,20000
        ),

        stepper(
          'transULN',
          'AST/ALT ULN (U/L)',
          40,5,1000,true,1
        ),

        choice(
          'rising',
          'Transaminases rising?',
          yesno
        )
      ].join('')
    },

    /* 4. CLINICAL */

    {
      title:'Clinical and Safety',

      content:[
        choice(
          'fever',
          'Fever in last 48 hours?',
          yesno
        ),

        choice(
          'infection',
          'Serious infection?',
          yesno
        ),

        choice(
          'jaundice',
          'Clinical jaundice?',
          yesno
        ),

        choice(
          'mucositis',
          'Mucositis?',
          yesno
        ),

        choice(
          'tpmt',
          'TPMT status',
          genetics
        ),

        choice(
          'nudt15',
          'NUDT15 status',
          genetics
        ),

        choice(
          'adherence',
          'Were all prescribed doses taken?',
          [
            ['good','YES','good'],
            ['missed','NO','bad'],
            ['unknown','Not sure','neutral']
          ]
        )
      ].join('')
    }
  ];

  /* TAB NAMES */

  const tabNames = [
    'Patient',
    'CBC',
    'LFT Panel',
    'Clinical'
  ];

  tabsBox.innerHTML = tabNames.map(
    (name,i) => `
      <button type="button"
        class="tab ${i === 0 ? 'active' : ''}"
        data-tab="${i}"
        aria-selected="${i === 0}">
        ${i+1}. ${name}
      </button>
    `
  ).join('');

  /* GENERATE PAGES */

  form.innerHTML = pages.map(
    (page,i) => `
      <section data-page="${i}"
        ${i === 0 ? '' : 'hidden'}>

        <h2>${page.title}</h2>

        <div class="stack">
          ${page.content}
        </div>

        <div class="actions">

          ${i > 0 ? `
            <button type="button"
              class="action secondary"
              data-go="${i-1}">
              ← Previous
            </button>
          ` : ''}

          ${i < 3 ? `
            <button type="button"
              class="action"
              data-go="${i+1}">
              Next →
            </button>
          ` : `
            <button type="submit"
              id="calculate"
              class="action">
              Calculate Assessment
            </button>

            <button type="button"
              id="reset"
              class="action secondary">
              Reset
            </button>
          `}
        </div>

        ${footer}
      </section>
    `
  ).join('');

  const panels = [
    ...form.querySelectorAll('[data-page]')
  ];

  const tabs = [
    ...tabsBox.querySelectorAll('[data-tab]')
  ];

  const calculateButton =
    document.getElementById('calculate');

  /* TAB NAVIGATION */

  function showTab(i) {

    panels.forEach((p,n) => {
      p.hidden = n !== i;
    });

    tabs.forEach((t,n) => {
      t.classList.toggle(
        'active',
        n === i
      );

      t.setAttribute(
        'aria-selected',
        String(n === i)
      );
    });
  }

  /* SELECT A CLINICAL BUTTON */

  function selectChoice(group,value) {

    form.elements[group.dataset.choice].value =
      value;

    group.querySelectorAll('.choice')
      .forEach(button => {

        const selected =
          button.dataset.value === value;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          String(selected)
        );
      });
  }

  /* APPLY GREEN DEFAULTS */

  function applyDefaultChoices() {

    for (
      const [name,value]
      of Object.entries(defaults)
    ) {

      const group = form.querySelector(
        `[data-choice="${name}"]`
      );

      if (group) {
        selectChoice(group,value);
      }
    }
  }

  // Automatically preselect on opening
  applyDefaultChoices();

  /* TAB CLICKS */

  tabsBox.addEventListener('click', e => {

    const button =
      e.target.closest('[data-tab]');

    if (button) {
      showTab(Number(button.dataset.tab));
    }
  });

  /* FORM BUTTON CLICKS */

  form.addEventListener('click', e => {

    const go = e.target.closest('[data-go]');

    if (go) {
      showTab(Number(go.dataset.go));
    }

    /* +/- BUTTONS */

    const btn = e.target.closest('[data-delta]');

    if (btn) {

      const group =
        btn.closest('.stepper');

      const input =
        group.querySelector('input');

      const step =
        Number(group.dataset.step);

      const direction =
        Number(btn.dataset.delta);

      const min = input.min === ''
        ? -Infinity
        : Number(input.min);

      const max = input.max === ''
        ? Infinity
        : Number(input.max);

      const value = Math.max(
        min,
        Math.min(
          max,
          Number(input.value || 0) +
          direction * step
        )
      );

      const places =
        (String(step).split('.')[1] || '').length;

      input.value =
        Number(value.toFixed(places));

      input.dispatchEvent(
        new Event('input', {bubbles:true})
      );
    }

    /* CLINICAL CHOICE BUTTONS */

    const pressed =
      e.target.closest('[data-value]');

    if (pressed) {

      const group =
        pressed.closest('[data-choice]');

      selectChoice(
        group,
        pressed.dataset.value
      );

      form.elements[
        group.dataset.choice
      ].dispatchEvent(
        new Event('change', {bubbles:true})
      );
    }
  });

  /* BSA CALCULATION */

  function updateBsa() {

    const h =
      Number(form.elements.height.value);

    const w =
      Number(form.elements.weight.value);

    const bsa = h > 0 && w > 0
      ? Math.sqrt(h*w/3600)
      : NaN;

    document.getElementById('bsa')
      .textContent =
        'Estimated BSA: ' +
        (
          Number.isFinite(bsa)
            ? bsa.toFixed(3) + ' m²'
            : '—'
        );
  }

  /* SLIDER SYNCHRONISATION */

  form.querySelectorAll('[data-slider]')
    .forEach(slider => {

      const numberInput =
        form.elements[
          slider.dataset.slider
        ];

      slider.addEventListener('input', () => {

        numberInput.value = slider.value;

        numberInput.dispatchEvent(
          new Event('input', {bubbles:true})
        );
      });

      numberInput.addEventListener('input', () => {

        if (numberInput.value !== '') {
          slider.value = numberInput.value;
        }

        updateBsa();
      });
    });

  updateBsa();

  /* FOUR-DIGIT CR */

  const cr = form.elements.demoId;

  cr.addEventListener('input', () => {
    cr.value = cr.value
      .replace(/\D/g,'')
      .slice(0,4);
  });

  /* INVALIDATE OLD RESULTS */

  function invalidate(event) {

    version++;

    lastInput = null;
    saved = false;

    result.style.display = 'none';
    saveButton.disabled = true;
    saveButton.hidden = true;
    saveState.textContent = '';
    saveState.classList.remove('unsaved');
    message.textContent = '';

  }

  form.addEventListener('input', invalidate);
  form.addEventListener('change', invalidate);

  /* FORM VALIDATION */

  function validate() {

    for (
      const el
      of form.querySelectorAll('input')
    ) {

      if (
        el.type === 'range' ||
        el.type === 'hidden' ||
        el.type === 'checkbox'
      ) continue;

      if (!el.checkValidity()) {

        showTab(
          Number(
            el.closest('[data-page]')
              .dataset.page
          )
        );

        message.textContent =
          'Please correct the highlighted field.';

        el.focus();
        el.reportValidity();

        return false;
      }
    }

    for (
      const group
      of form.querySelectorAll('[data-choice]')
    ) {

      if (
        !form.elements[
          group.dataset.choice
        ].value
      ) {

        showTab(
          Number(
            group.closest('[data-page]')
              .dataset.page
          )
        );

        group.querySelector('button').focus();

        message.textContent =
          'Please select all clinical answers.';

        return false;
      }
    }


    return true;
  }

  /* DISPLAY RESULT */

  function render(payload, submitted) {
    const r = payload && payload.assessment;
    busy = false;
    calculateButton.disabled = false;

    if (submitted !== version) {
      message.textContent = 'Inputs changed. Calculate again.';
      return;
    }

    if (!r || typeof r.hardStop !== 'boolean' ||
        !Array.isArray(r.stopReasons)) {
      result.style.display = 'none';
      saveButton.disabled = true;
      message.textContent =
        'Backend mismatch: install the v5 Code.gs with hard-stop support.';
      return;
    }

    result.style.display = 'block';
    saved = !!payload.saved;
    saveButton.disabled = saved;
    saveButton.hidden = saved;
    saveState.classList.toggle('unsaved', !saved);
    if (saved) {
      const when = payload.savedAt ? new Date(payload.savedAt).toLocaleString() : 'now';
      saveState.textContent =
        'Saved automatically • CR ' + lastInput.demoId + ' • ' + when;
    } else {
      saveState.textContent =
        'NOT SAVED — ' + (payload.saveError || 'Storage error') +
        '. Use Retry save.';
    }

    // HARD STOP: suppress ALL numerical dose suggestions and reference doses.
    stopBox.hidden = !r.hardStop;
    stopReasons.replaceChildren();
    if (r.hardStop) {
      (r.stopReasons || []).forEach(reason => {
        const line = document.createElement('div');
        line.textContent = '• ' + reason;
        stopReasons.appendChild(line);
      });
    }

    const lines = [
      'CR: ' + lastInput.demoId,
      'Status: ' + r.status,
      'BSA: ' + r.bsa + ' m²'
    ];

    if (!r.hardStop && r.candidate) {
      lines.push('Reference 6-MP: ' + r.ref6 + ' mg/day');
      lines.push('Reference MTX: ' + r.refM + ' mg/week');
      lines.push('UNVALIDATED DOSE CANDIDATE — CLINICIAN REVIEW');
      lines.push('6-MP: ' + r.candidate.mpDaily + ' mg/day');
      lines.push('MTX: ' + r.candidate.mtxWeekly + ' mg/week');
      lines.push('Change: ' + r.candidate.changePercent + '%');
    } else {
      lines.push('NO AUTOMATED DOSE SUGGESTION. Clinician review required.');
    }

    lines.push('ASSESSMENT ONLY — NOT AN AUTHORISED PRESCRIPTION.');
    output.textContent = lines.join('\n');

    const ul = document.getElementById('warnings');
    ul.replaceChildren();
    (r.warnings || []).forEach(w => {
      const li = document.createElement('li');
      li.textContent = w;
      ul.appendChild(li);
    });

    message.textContent = r.hardStop
      ? 'Hard stop — automated dose suggestion blocked.'
      : 'Assessment complete.';
    if (!saved) message.textContent += ' AUTOSAVE FAILED — NOT SAVED.';
  }

  /* ERROR HANDLING */

  function error(e, input, seq) {
    busy = false;
    calculateButton.disabled = false;
    if (seq !== version) return;
    const detail = (e && e.message) || String(e);
    message.textContent = 'AUTOSAVE FAILED — NOT SAVED: ' +
      detail + '. Fetching safety assessment...';
    // A save failure must not hide toxicity findings.
    google.script.run
      .withSuccessHandler(r => render({
        assessment: r, saved: false, saveError: detail
      }, seq))
      .withFailureHandler(second => {
        if (seq !== version) return;
        message.textContent =
          'Assessment and save unavailable — NOT SAVED: ' +
          ((second && second.message) || String(second));
      })
      .assessCase(input);
  }

  /* CALCULATE AND AUTO-SAVE */

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (busy || !validate()) return;
    if (!(window.google && google.script && google.script.run)) {
      message.textContent = 'Open inside Google Apps Script.';
      return;
    }

    const data = Object.fromEntries(new FormData(form).entries());
    data._entryId =
      (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : (Date.now().toString(36) + '_' +
           Math.random().toString(36).slice(2) + '_' +
           Math.random().toString(36).slice(2));
    lastInput = data;
    const seq = version;

    result.style.display = 'none';
    saveButton.disabled = true;
    saveButton.hidden = true;
    calculateButton.disabled = true;
    busy = true;
    message.textContent = 'Calculating and saving assessment...';

    google.script.run
      .withSuccessHandler(payload => render(payload, seq))
      .withFailureHandler(err => error(err, data, seq))
      .assessAndSave(data);
  });

    /* RESET */

  document.getElementById('reset')
    .addEventListener('click', () => {

      form.reset();

      form.querySelectorAll('[data-slider]')
        .forEach(s => {

          s.value =
            form.elements[
              s.dataset.slider
            ].value;
        });

      // Restore all green defaults
      applyDefaultChoices();

      updateBsa();

      invalidate();

      showTab(0);
    });

  /* MANUAL RETRY ONLY AFTER AUTO-SAVE FAILURE */

  saveButton.addEventListener('click', () => {
    if (!lastInput || busy || saveBusy || saved) return;
    const input = Object.assign({}, lastInput);
    const seq = version;
    saveBusy = true;
    saveButton.disabled = true;
    message.textContent = 'Retrying save...';

    google.script.run
      .withSuccessHandler(text => {
        saveBusy = false;
        if (seq !== version) return;
        saved = true;
        saveButton.hidden = true;
        saveState.classList.remove('unsaved');
        saveState.textContent = 'Saved successfully • CR ' + input.demoId;
        message.textContent = text;
      })
      .withFailureHandler(err => {
        saveBusy = false;
        if (seq !== version) return;
        saveButton.disabled = false;
        saveButton.hidden = false;
        saveState.classList.add('unsaved');
        saveState.textContent =
          'NOT SAVED — ' + ((err && err.message) || String(err)) + '. Retry save.';
        message.textContent = 'Save failed — NOT SAVED.';
      })
      .saveAssessment(input);
  });

    /* PRINT */

  document.getElementById('print')
    .addEventListener('click', () => {
      window.print();
    });

})();
</script>

</body>
</html>
