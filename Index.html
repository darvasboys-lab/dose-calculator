<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGICH ALL Maintenance Calculator</title>

<style>
/*
 * PGICH ALL — Premium Minimal UI (v6)
 * Visual styles only; calculation, saving, and safety logic unchanged.
 * Optimised for narrow Google Sheets sidebars and mobile screens.
 */
:root {
  color-scheme: light;
  --blue: #166ca8;
  --blue-deep: #115d94;
  --blue-soft: #eaf3fa;
  --green: #18734c;
  --red: #b42c37;
  --ink: #1d3043;
  --muted: #728193;
  --gold: #916c2f;
  --canvas: #f5f7fa;
  --surface: #ffffff;
  --stroke: #e6ebf1;
  --ring: rgba(34,119,183,.18);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(
    180deg,
    #f8fafc 0%,
    var(--canvas) 45%,
    #f1f4f8 100%
  );
  color: var(--ink);
  font: 14.5px/1.46 -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: -.006em;
  -webkit-font-smoothing: antialiased;
}

main {
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  padding: 18px 16px
    max(28px, env(safe-area-inset-bottom));
}

/* MINIMAL HEADER */

header {
  padding: 12px 5px 16px;
  color: var(--ink);
  background: transparent;
  border: 0;
  box-shadow: none;
}

h1 {
  margin: 0;
  font-size: clamp(20px, 3vw, 23px);
  line-height: 1.22;
  font-weight: 740;
  letter-spacing: -.045em;
}

header::after {
  display: block;
  content: "";
  width: 34px;
  height: 3px;
  margin-top: 13px;
  border-radius: 99px;
  background: linear-gradient(
    90deg, #9b753b, #d8b978
  );
}

h2 {
  margin: 0 0 22px;
  color: #24384b;
  font-size: 17px;
  line-height: 1.3;
  letter-spacing: -.025em;
  font-weight: 725;
}

/* iOS-STYLE SEGMENTED TABS */

.tabs {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(0, 1fr));
  gap: 3px;
  padding: 5px;
  margin: 0 0 14px;
  background: #e9edf2;
  border: 1px solid #e2e8ef;
  border-radius: 15px;
  box-shadow:
    inset 0 1px 2px rgba(23,48,70,.035);
}

.tab {
  appearance: none;
  min-width: 0;
  min-height: 43px;
  border: 0;
  border-radius: 11px;
  padding: 8px 3px;
  background: transparent;
  color: #617387;
  font: inherit;
  font-size: 11.5px;
  font-weight: 680;
  line-height: 1.15;
  letter-spacing: -.018em;
  white-space: nowrap;
  transition:
    background .16s ease,
    box-shadow .16s ease,
    color .16s ease;
}

.tab.active {
  color: #194261;
  background: var(--surface);
  box-shadow:
    0 2px 7px rgba(20,45,67,.085),
    0 1px 1px rgba(20,45,67,.05);
}

/* PREMIUM CARDS */

section {
  margin: 0 0 14px;
  padding: 23px 22px 19px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: 21px;
  box-shadow:
    0 9px 30px rgba(32,52,73,.045),
    0 2px 6px rgba(32,52,73,.02);
}

section[hidden] {
  display: none !important;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}

.field-label {
  color: #394b5e;
  font-size: 13.5px;
  font-weight: 680;
  letter-spacing: -.01em;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

/* INPUTS */

input:not([type=range]):not([type=checkbox]):not([type=hidden]) {
  appearance: none;
  width: 100%;
  min-width: 0;
  height: 50px;
  padding: 10px 13px;
  border: 1px solid #dbe3eb;
  border-radius: 12px;
  outline: none;
  background: #fbfcfe;
  color: var(--ink);
  font: 620 16px/1.25
    -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

input:not([type=range]):not([type=checkbox]):not([type=hidden]):focus {
  border-color: #5b9fc9;
  box-shadow: 0 0 0 3px var(--ring);
}

/* REMOVE EXTRA NUMBER SPINNERS */

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type=number] {
  -moz-appearance: textfield;
}

/* BODY MEASUREMENT SLIDERS */

input[type=range] {
  width: 100%;
  min-width: 0;
  height: 32px;
  margin: 0;
  padding: 0;
  border: 0;
  accent-color: var(--blue);
  cursor: pointer;
}

.rangeLine {
  display: flex;
  align-items: center;
  gap: 13px;
}

.rangeLine input[type=range] {
  flex: 1 1 auto;
}

.rangeLine input[type=number] {
  flex: 0 0 84px;
  width: 84px;
  height: 48px;
  padding: 8px 7px;
  text-align: center;
}

/* PROPORTIONATE +/- BUTTONS */

.stepper {
  display: grid;
  grid-template-columns:
    minmax(48px,.9fr)
    minmax(96px,1.58fr)
    minmax(48px,.9fr);
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 302px;
  margin: 2px auto 0;
}

.stepper input[type=number] {
  width: 100%;
  min-width: 0;
  height: 54px;
  padding: 6px 4px;
  border: 1.5px solid #d8e1eb;
  border-radius: 13px;
  background: #ffffff;
  font-size: 22px;
  font-weight: 760;
  line-height: 1.2;
  letter-spacing: -.035em;
  text-align: center;
  box-shadow:
    0 2px 5px rgba(38,65,90,.035);
}

.stepper button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 60px;
  min-height: 60px;
  padding: 0 0 3px;
  border: 1px solid #dceaf6;
  border-radius: 15px;
  background: var(--blue-soft);
  color: var(--blue-deep);
  font-size: 36px;
  font-weight: 480;
  line-height: 1;
  transition:
    background .15s ease,
    transform .12s ease;
}

.stepper button:active {
  background: #d9eaf7;
}

.field:has(> .stepper) > .field-label {
  text-align: center;
}

/* YES/NO AND GENETIC CHOICE BUTTONS */

.choices {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0,1fr));
  gap: 9px;
}

.choices.three {
  grid-template-columns:
    repeat(3, minmax(0,1fr));
}

.choice {
  appearance: none;
  min-width: 0;
  min-height: 50px;
  padding: 9px 7px;
  border: 1.5px solid #dce4ec;
  border-radius: 13px;
  background: #f9fbfd;
  color: #5a6d7e;
  font: inherit;
  font-size: 13px;
  font-weight: 670;
  letter-spacing: -.01em;
  transition:
    background .15s ease,
    color .15s ease,
    border-color .15s ease;
}

.choice.selected.good {
  background: #eaf6ee;
  border-color: #96ceb0;
  color: #14643f;
}

.choice.selected.bad {
  background: #fff0f0;
  border-color: #e7a0a5;
  color: #9c2832;
}

.choice.selected.neutral {
  background: #fff6e5;
  border-color: #e7c17d;
  color: #926c27;
}

/* BUTTONS */

button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.987);
}

button:disabled {
  opacity: .48;
  cursor: not-allowed;
}

button:focus-visible,
input[type=range]:focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
}

/* PRIMARY AND SECONDARY ACTIONS */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 25px;
}

.action {
  flex: 1 1 120px;
  min-height: 48px;
  padding: 12px 15px;
  border: 1px solid transparent;
  border-radius: 13px;
  background: var(--blue);
  color: #ffffff;
  font: inherit;
  font-size: 13px;
  font-weight: 720;
  letter-spacing: -.012em;
  box-shadow:
    0 3px 9px rgba(24,92,145,.1);
}

.action.secondary {
  background: #eef3f8;
  border-color: #e5ecf3;
  box-shadow: none;
  color: #49657d;
}

.action[hidden] {
  display: none !important;
}

/* BSA CARD */

.bsa {
  padding: 13px 15px;
  border: 1px solid #e0ebf4;
  border-radius: 13px;
  background: #f2f7fb;
  color: #335b78;
  font-size: 13.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* TOXICITY HARD STOP */

.stop-alert {
  margin-bottom: 14px;
  padding: 15px;
  border: 1.5px solid #df8c92;
  border-left: 4px solid var(--red);
  border-radius: 14px;
  background: #fff2f2;
  color: #8b252d;
  font-size: 13px;
  line-height: 1.6;
}

.stop-alert[hidden] {
  display: none !important;
}

.stop-alert strong {
  display: block;
  margin-bottom: 8px;
  font-weight: 780;
}

.stop-alert small {
  display: block;
  margin-top: 9px;
  color: #73424b;
}

/* RESULTS */

.summary {
  padding: 15px;
  border: 1px solid #e6edf4;
  border-radius: 14px;
  background: #f7f9fc;
  color: #33495d;
  font-size: 13.5px;
  line-height: 1.75;
  white-space: pre-line;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

#result {
  display: none;
}

#message {
  margin: 9px 2px 0;
  min-height: 0;
  color: #506b80;
  font-size: 12.5px;
  font-weight: 620;
  line-height: 1.5;
}

#message:empty {
  display: none;
}

.save-state {
  margin-top: 13px;
  color: #17724b;
  font-size: 12.5px;
  font-weight: 690;
  line-height: 1.5;
}

.save-state.unsaved {
  color: var(--red);
}

/* GOLDEN DEVELOPER CREDIT */

.dev-credit {
  margin-top: 26px;
  padding-top: 13px;
  border-top: 1px solid #eff2f6;
  color: var(--gold);
  opacity: .92;
  text-align: center;
  font-size: 10.5px;
  font-weight: 720;
  letter-spacing: .015em;
}

/* MOBILE LAYOUT */

@media (max-width: 430px) {
  main {
    padding: 12px 9px
      max(22px, env(safe-area-inset-bottom));
  }

  header {
    padding: 12px 7px 15px;
  }

  h1 {
    font-size: 20px;
  }

  section {
    padding: 20px 16px 18px;
    border-radius: 19px;
  }

  h2 {
    font-size: 16.5px;
    margin-bottom: 19px;
  }

  .stack {
    gap: 20px;
  }

  .tabs {
    gap: 2px;
    padding: 4px;
    border-radius: 13px;
  }

  .tab {
    min-height: 42px;
    padding: 7px 1px;
    font-size: 10.5px;
  }

  .stepper {
    max-width: 288px;
    gap: 8px;
  }

  .stepper button {
    height: 58px;
    min-height: 58px;
    font-size: 35px;
  }

  .stepper input[type=number] {
    height: 52px;
    font-size: 20px;
  }

  .rangeLine {
    gap: 9px;
  }

  .rangeLine input[type=number] {
    flex-basis: 76px;
    width: 76px;
  }

  .choice {
    min-height: 49px;
    font-size: 12.5px;
  }

  .actions {
    gap: 8px;
    margin-top: 22px;
  }

  .action {
    min-height: 47px;
    padding: 11px 10px;
    font-size: 12.5px;
  }
}

@media (max-width: 320px) {
  main {
    padding-inline: 6px;
  }

  section {
    padding: 18px 12px;
  }

  .tab {
    font-size: 10px;
  }

  .stepper {
    gap: 6px;
    grid-template-columns:
      minmax(45px,.8fr)
      minmax(86px,1.6fr)
      minmax(45px,.8fr);
  }

  .stepper button {
    height: 55px;
    min-height: 55px;
    font-size: 33px;
  }

  .stepper input[type=number] {
    font-size: 19px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

@media print {
  body {
    background: #fff;
  }

  main {
    max-width: none;
    padding: 0;
  }

  header,
  .tabs,
  form,
  #message,
  .actions {
    display: none !important;
  }

  #result {
    display: block !important;
    border: none;
    box-shadow: none;
  }

  .save-state {
    color: #263c4c;
  }
}
/* ======================================
   PGICH ALL — MOBILE FULL-SCREEN PATCH
   iPhone + Android
   ====================================== */

@media screen and (max-width: 767px) {

  html,
  body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  body {
    background: #f5f7fa;
  }

  main {
    width: 100%;
    max-width: none;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    padding:
      max(10px, env(safe-area-inset-top))
      max(7px, env(safe-area-inset-right))
      max(22px, env(safe-area-inset-bottom))
      max(7px, env(safe-area-inset-left));
  }

  header,
  .tabs,
  form,
  form > section,
  #result {
    width: 100%;
    max-width: none;
    min-width: 0;
  }

  header {
    padding: 14px 8px 18px;
  }

  section {
    padding: 20px 16px;
    border-radius: 18px;
  }

  .stack,
  .field,
  .rangeLine {
    min-width: 0;
  }

  .tabs {
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
  }
}

  /* Do not let sliders and tab text force horizontal scrolling. */
  @media screen and (max-width: 767px) {
    .rangeLine { min-width: 0; }
    .rangeLine input[type=range] { min-width: 0; }
    .tab { overflow: hidden; text-overflow: ellipsis; }
    .stepper { max-width: min(100%, 302px); }
  }

/* -------------------------------------------
   PREMIUM REPORT + FINAL-PAGE ONLY FOOTER v7
   ------------------------------------------- */
header::after { display: none !important; }

.dev-credit {
  margin: 17px auto 1px;
  padding: 8px 0 1px;
  border: 0;
  background: transparent;
  text-align: center;
  font: normal 500 10px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: .015em;
  color: #8793a1;
}

/* Large, obvious primary action on last step */
#calculate {
  display: block;
  width: 100%;
  flex: 1 0 100%;
  min-height: 64px;
  padding: 18px 16px;
  border-radius: 16px;
  background: linear-gradient(180deg, #237fb9, #12639b);
  color: white;
  font-size: 17px;
  font-weight: 750;
  letter-spacing: -.02em;
  box-shadow: 0 6px 18px rgba(22,106,166,.18);
}
#calculate:active { background: #125b91; }
#reset { flex: 1 0 100%; }

#result {
  scroll-margin-top: 12px;
  padding: 23px 20px 21px;
  border-radius: 20px;
  border-color: #dce6ee;
}
#result > h2 {
  margin: 0 0 17px;
  font-size: 21px;
  font-weight: 760;
}
.report-eyebrow {
  margin: 0 0 5px;
  color: #6b8193;
  font-size: 10px;
  font-weight: 780;
  letter-spacing: .135em;
}
.report-loading {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 19px 15px;
  border: 1px solid #dfebf5;
  background: #f4f8fc;
  border-radius: 14px;
  color: #456b86;
  font-size: 13px;
  font-weight: 670;
}
.report-loading[hidden], .summary[hidden] { display: none !important; }
.report-spinner {
  flex: 0 0 17px;
  width: 17px;
  height: 17px;
  border: 2px solid #b8d6e9;
  border-top-color: #176eaa;
  border-radius: 50%;
  animation: report-spin .75s linear infinite;
}
@keyframes report-spin { to { transform: rotate(360deg); } }

#result .summary {
  display: grid;
  gap: 12px;
  padding: 0;

.report-hero {

.report-label {

  margin-bottom: 5px;

  font-size: 11px;

}
.report-strong {

  font-size: 17px;

  overflow-wrap: anywhere;
}
.report-cr {

}
.report-hero.critical {

  background: #fff5f5;
}
.report-hero.critical .report-strong { color: #a32935; }

  display: grid;

}
.report-tile {

  background: #f8fafc;
  border: 1px solid #e6edf3;
  border-radius: 13px;
}
.report-value {
  color: #253f54;
  font-size: 19px;

}
.report-value span {

.report-dose {

}
.report-dose .report-tile {

}

}
.report-no-dose {

  padding: 11px 12px;

}

  .report-spinner { animation: none; }
}

  header.app-header {
    padding: 12px 5px 10px;
    margin-bottom: 11px;
  }
  header.app-header h1 {
    font-size: clamp(19px, 5.2vw, 22px);
  }
}
</style>
</head>

<body>
<main>

<header class="app-header">
  <h1>PGICH ALL Maintenance Calculator</h1>
</header>

<nav id="tabs" class="tabs"
  aria-label="Calculator tabs">
</nav>

<form id="f" novalidate></form>

<p id="message" role="status"
  aria-live="polite"></p>

<section id="result" aria-label="Assessment report">
  <div class="report-eyebrow">ASSESSMENT REPORT</div>
  <h2>Assessment Summary</h2>

  <div id="resultLoading" class="report-loading" hidden role="status">
    <span class="report-spinner" aria-hidden="true"></span>
    <span id="loadingText">Preparing assessment…</span>
  </div>

  <div id="stopBox"
    class="stop-alert"
    hidden
    role="alert">

    <strong>
      HARD STOP — AUTOMATED DOSE SUGGESTION BLOCKED
    </strong>

    <div id="stopReasons"></div>

    <small>
      This alert blocks the software's dose
      suggestion; treatment decisions require
      the oncologist.
    </small>
  </div>

  <div id="output" class="summary" hidden></div>

  <div id="saveState"
    class="save-state"
    role="status"
    aria-live="polite">
  </div>

  <ul id="warnings"></ul>

  <div class="actions">
    <button id="save"
      class="action secondary"
      type="button"
      hidden disabled>
      Retry save
    </button>

    <button id="print"
      class="action secondary"
      type="button">
      Print assessment
    </button>
  </div>

</section>

</main>

<script>
(function () {
  'use strict';

  const form = document.getElementById('f');
  const tabsBox = document.getElementById('tabs');
  const result = document.getElementById('result');
  const message = document.getElementById('message');
  const output = document.getElementById('output');
  const saveButton = document.getElementById('save');
  const saveState = document.getElementById('saveState');
  const stopBox = document.getElementById('stopBox');
  const stopReasons = document.getElementById('stopReasons');
  const resultLoading = document.getElementById('resultLoading');
  const loadingText = document.getElementById('loadingText');
  const warningsBox = document.getElementById('warnings');

  const footer = `
    <footer class="dev-credit" aria-label="Developer credit">
      Developed by Dr Aman Singh
    </footer>
  `;

  let lastInput = null;
  let version = 0;
  let busy = false;
  let saved = false;
  let saveBusy = false;

  saveButton.disabled = true;
  saveButton.hidden = true;

  /* DEFAULT PRESELECTED VALUES */

  // These are demo defaults.
  // They are NOT verified patient findings.

  const defaults = {
    rising: 'no',
    fever: 'no',
    infection: 'no',
    jaundice: 'no',
    mucositis: 'no',
    tpmt: 'normal',
    nudt15: 'normal',
    adherence: 'good'
  };

  const yesno = [
    ['yes', 'YES', 'bad'],
    ['no', 'NO', 'good']
  ];

  const genetics = [
    ['normal', 'Normal', 'good'],
    ['variant', 'Variant', 'bad'],
    ['unknown', 'Unknown', 'neutral']
  ];

  /* FIELD GENERATORS */

  function field(label, content) {
    return `
      <div class="field">
        <span class="field-label">${label}</span>
        ${content}
      </div>
    `;
  }

  function slider(
    name, label, min, max, step, val
  ) {
    return field(label, `
      <div class="rangeLine">
        <input type="range"
          data-slider="${name}"
          min="${min}"
          max="${max}"
          step="${step}"
          value="${val}"
          aria-label="${label} slider">

        <input type="number"
          name="${name}"
          min="${min}"
          max="${max}"
          step="any"
          value="${val}"
          required
          aria-label="${label}">
      </div>
    `);
  }

  function plain(name, label, val) {
    return field(label, `
      <input name="${name}"
        type="number"
        min="0"
        max="1000"
        step="any"
        value="${val}"
        required
        aria-label="${label}">
    `);
  }

  function stepper(
    name, label, val, step, max,
    required = true, min = 0
  ) {
    return field(label, `
      <div class="stepper" data-step="${step}">

        <button type="button"
          data-delta="-1"
          aria-label="Decrease ${label}">
          −
        </button>

        <input name="${name}"
          type="number"
          inputmode="decimal"
          min="${min}"
          max="${max}"
          step="any"
          value="${val}"
          ${required ? 'required' : ''}
          aria-label="${label}">

        <button type="button"
          data-delta="1"
          aria-label="Increase ${label}">
          +
        </button>

      </div>
    `);
  }

  function choice(name, label, items) {
    const buttons = items.map(item => `
      <button type="button"
        class="choice ${item[2]}"
        data-value="${item[0]}"
        aria-pressed="false">
        ${item[1]}
      </button>
    `).join('');

    return field(label, `
      <div class="choices
        ${items.length === 3 ? 'three' : ''}"
        data-choice="${name}">
        ${buttons}
      </div>

      <input type="hidden"
        name="${name}"
        value="">
    `);
  }

  /* FOUR TABS */

  const pages = [

    /* 1. PATIENT */

    {
      title: 'Patient Details',
      content: [
        slider(
          'age', 'Age (years)',
          0, 25, 0.5, 6
        ),

        slider(
          'height', 'Height (cm)',
          35, 230, 1, 115
        ),

        slider(
          'weight', 'Weight (kg)',
          1, 200, 0.5, 20
        ),

        `
          <div class="bsa" id="bsa">
            Estimated BSA: —
          </div>
        `,

        plain(
          'current6',
          'Current 6-MP (mg/day)',
          35
        ),

        plain(
          'currentM',
          'Current MTX (mg/week)',
          20
        ),

        `<p class="dose-prefill-note">
          Prefilled example values only. Confirm the actual
          prescribed doses before calculating.
        </p>`,

        field('CR Number (4 digits)', `
          <input name="demoId"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="off"
            placeholder="0001"
            required>
        `)
      ].join('')
    },

    /* 2. CBC */

    {
      title: 'Complete Blood Count',
      content: [
        stepper(
          'wbc', 'WBC / TLC (/µL)',
          2500, 100, 200000
        ),

        stepper(
          'anc', 'ANC (/µL)',
          1000, 100, 200000
        ),

        stepper(
          'alc', 'ALC (/µL)',
          900, 100, 200000
        ),

        stepper(
          'platelets', 'Platelets (/µL)',
          180000, 1000, 2000000
        ),

        stepper(
          'prevWbc', 'Previous WBC (/µL)',
          2600, 100, 200000, false
        ),

        stepper(
          'prevAnc', 'Previous ANC (/µL)',
          1050, 100, 200000, false
        )
      ].join('')
    },

    /* 3. LFT PANEL */

    {
      title: 'LFT Panel',
      content: [
        stepper(
          'bilirubin',
          'Total bilirubin (mg/dL)',
          0.8, 0.1, 100
        ),

        stepper(
          'biliULN',
          'Bilirubin ULN (mg/dL)',
          1, 0.1, 20, true, 0.01
        ),

        stepper(
          'ast',
          'AST / SGOT (U/L)',
          30, 5, 20000
        ),

        stepper(
          'alt',
          'ALT / SGPT (U/L)',
          30, 5, 20000
        ),

        stepper(
          'transULN',
          'AST/ALT ULN (U/L)',
          40, 5, 1000, true, 1
        ),

        choice(
          'rising',
          'Transaminases rising?',
          yesno
        )
      ].join('')
    },

    /* 4. CLINICAL */

    {
      title: 'Clinical and Safety',
      content: [
        choice(
          'fever',
          'Fever in last 48 hours?',
          yesno
        ),

        choice(
          'infection',
          'Serious infection?',
          yesno
        ),

        choice(
          'jaundice',
          'Clinical jaundice?',
          yesno
        ),

        choice(
          'mucositis',
          'Mucositis?',
          yesno
        ),

        choice(
          'tpmt',
          'TPMT status',
          genetics
        ),

        choice(
          'nudt15',
          'NUDT15 status',
          genetics
        ),

        choice(
          'adherence',
          'Were all prescribed doses taken?',
          [
            ['good', 'YES', 'good'],
            ['missed', 'NO', 'bad'],
            ['unknown', 'Not sure', 'neutral']
          ]
        )
      ].join('')
    }
  ];

  /* TAB NAMES */

  const tabNames = [
    'Patient',
    'CBC',
    'LFT Panel',
    'Clinical'
  ];

  tabsBox.innerHTML = tabNames.map(
    (name, i) => `
      <button type="button"
        class="tab ${i === 0 ? 'active' : ''}"
        data-tab="${i}"
        aria-selected="${i === 0}">
        ${i + 1}. ${name}
      </button>
    `
  ).join('');

  /* GENERATE PAGES */

  form.innerHTML = pages.map(
    (page, i) => `
      <section data-page="${i}"
        ${i === 0 ? '' : 'hidden'}>

        <h2>${page.title}</h2>

        <div class="stack">
          ${page.content}
        </div>

        <div class="actions">

          ${i > 0 ? `
            <button type="button"
              class="action secondary"
              data-go="${i - 1}">
              ← Previous
            </button>
          ` : ''}

          ${i < 3 ? `
            <button type="button"
              class="action"
              data-go="${i + 1}">
              Next →
            </button>
          ` : `
            <button type="submit"
              id="calculate"
              class="action">
              Calculate Assessment
            </button>

            <button type="button"
              id="reset"
              class="action secondary">
              Reset
            </button>
          `}
        </div>

        ${i === 3 ? footer : ''}
      </section>
    `
  ).join('');

  const panels = [
    ...form.querySelectorAll('[data-page]')
  ];

  const tabs = [
    ...tabsBox.querySelectorAll('[data-tab]')
  ];

  const calculateButton =
    document.getElementById('calculate');

  /* TAB NAVIGATION */

  function showTab(i) {
    panels.forEach((p, n) => {
      p.hidden = n !== i;
    });

    tabs.forEach((t, n) => {
      t.classList.toggle(
        'active',
        n === i
      );

      t.setAttribute(
        'aria-selected',
        String(n === i)
      );
    });
  }

  /* SELECT CLINICAL BUTTON */

  function selectChoice(group, value) {
    form.elements[group.dataset.choice].value =
      value;

    group.querySelectorAll('.choice')
      .forEach(button => {
        const selected =
          button.dataset.value === value;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          String(selected)
        );
      });
  }

  /* APPLY GREEN DEFAULTS */

  function applyDefaultChoices() {
    for (
      const [name, value]
      of Object.entries(defaults)
    ) {
      const group = form.querySelector(
        `[data-choice="${name}"]`
      );

      if (group) {
        selectChoice(group, value);
      }
    }
  }

  applyDefaultChoices();

  /* TAB CLICKS */

  tabsBox.addEventListener('click', e => {
    const button =
      e.target.closest('[data-tab]');

    if (button) {
      showTab(Number(button.dataset.tab));
    }
  });

  /* FORM BUTTON CLICKS */

  form.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');

    if (go) {
      showTab(Number(go.dataset.go));
    }

    /* +/- BUTTONS */

    const btn = e.target.closest('[data-delta]');

    if (btn) {
      const group = btn.closest('.stepper');
      const input = group.querySelector('input');

      const step =
        Number(group.dataset.step);

      const direction =
        Number(btn.dataset.delta);

      const min = input.min === ''
        ? -Infinity
        : Number(input.min);

      const max = input.max === ''
        ? Infinity
        : Number(input.max);

      const value = Math.max(
        min,
        Math.min(
          max,
          Number(input.value || 0) +
          direction * step
        )
      );

      const places =
        (String(step).split('.')[1] || '').length;

      input.value =
        Number(value.toFixed(places));

      input.dispatchEvent(
        new Event('input', {bubbles: true})
      );
    }

    /* CLINICAL CHOICE BUTTONS */

    const pressed =
      e.target.closest('[data-value]');

    if (pressed) {
      const group =
        pressed.closest('[data-choice]');

      selectChoice(
        group,
        pressed.dataset.value
      );

      form.elements[
        group.dataset.choice
      ].dispatchEvent(
        new Event('change', {bubbles: true})
      );
    }
  });

  /* BSA CALCULATION */

  function updateBsa() {
    const h =
      Number(form.elements.height.value);

    const w =
      Number(form.elements.weight.value);

    const bsa = h > 0 && w > 0
      ? Math.sqrt(h * w / 3600)
      : NaN;

    document.getElementById('bsa')
      .textContent =
        'Estimated BSA: ' +
        (
          Number.isFinite(bsa)
            ? bsa.toFixed(3) + ' m²'
            : '—'
        );
  }

  /* SLIDER SYNCHRONISATION */

  form.querySelectorAll('[data-slider]')
    .forEach(slider => {
      const numberInput =
        form.elements[
          slider.dataset.slider
        ];

      slider.addEventListener('input', () => {
        numberInput.value = slider.value;

        numberInput.dispatchEvent(
          new Event('input', {bubbles: true})
        );
      });

      numberInput.addEventListener('input', () => {
        if (numberInput.value !== '') {
          slider.value = numberInput.value;
        }

        updateBsa();
      });
    });

  updateBsa();

  /* FOUR-DIGIT CR */

  const cr = form.elements.demoId;

  cr.addEventListener('input', () => {
    cr.value = cr.value
      .replace(/\D/g, '')
      .slice(0, 4);
  });

  /* INVALIDATE OLD RESULTS */

  function invalidate() {
    version++;

    lastInput = null;
    saved = false;

    result.style.display = 'none';
    saveButton.disabled = true;
    saveButton.hidden = true;

    saveState.textContent = '';
    saveState.classList.remove('unsaved', 'pending');
    resultLoading.hidden = true;
    output.hidden = true;
    message.textContent = '';
  }

  form.addEventListener('input', invalidate);
  form.addEventListener('change', invalidate);

  /* FORM VALIDATION */

  function validate() {
    for (
      const el
      of form.querySelectorAll('input')
    ) {
      if (
        el.type === 'range' ||
        el.type === 'hidden' ||
        el.type === 'checkbox'
      ) continue;

      if (!el.checkValidity()) {
        showTab(
          Number(
            el.closest('[data-page]')
              .dataset.page
          )
        );

        message.textContent =
          'Please correct the highlighted field.';

        el.focus();
        el.reportValidity();

        return false;
      }
    }

    for (
      const group
      of form.querySelectorAll('[data-choice]')
    ) {
      if (
        !form.elements[
          group.dataset.choice
        ].value
      ) {
        showTab(
          Number(
            group.closest('[data-page]')
              .dataset.page
          )
        );

        group.querySelector('button').focus();

        message.textContent =
          'Please select all clinical answers.';

        return false;
      }
    }

    return true;
  }

  /* ASSESSMENT PRESENTATION */

  function element(tag, className, value) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (value !== undefined) el.textContent = String(value);
    return el;
  }

  function metric(label, value, unit) {
    const tile = element('div', 'report-tile');
    tile.appendChild(element('span', 'report-label', label));
    const val = element('div', 'report-value', value);
    if (unit) val.appendChild(element('span', '', ' ' + unit));
    tile.appendChild(val);
    return tile;
  }

  function showReport(r, seq, input) {
    if (seq !== version) return false;
    if (!r || typeof r.hardStop !== 'boolean' ||
        !Array.isArray(r.stopReasons)) {
      reportError('Assessment response not recognised. Check that the latest Code.gs is deployed.');
      return false;
    }

    result.style.display = 'block';
    resultLoading.hidden = true;
    output.hidden = false;
    output.replaceChildren();

    stopBox.hidden = !r.hardStop;
    stopReasons.replaceChildren();
    if (r.hardStop) {
      r.stopReasons.forEach(reason => {
        stopReasons.appendChild(element('div', '', '• ' + reason));
      });
    }

    const hero = element('div', 'report-hero' + (r.hardStop ? ' critical' : ''));
    const lead = element('div', '');
    lead.appendChild(element('span', 'report-label', 'ASSESSMENT STATUS'));
    lead.appendChild(element('div', 'report-strong', r.status || 'Review required'));
    hero.appendChild(lead);
    hero.appendChild(element('span', 'report-cr', 'CR ' + input.demoId));
    output.appendChild(hero);

    const basics = element('div', 'report-grid');
    basics.appendChild(metric('BODY SURFACE AREA', r.bsa == null ? '—' : r.bsa, 'm²'));
    basics.appendChild(metric('REVIEW', r.hardStop ? 'Required' : (r.candidate ? 'Candidate' : 'Required')));
    output.appendChild(basics);

    if (!r.hardStop && r.candidate) {
      const dose = element('div', 'report-dose');
      dose.appendChild(element('h3', 'report-dose-title', 'Illustrative dose candidate · clinician review'));
      const doses = element('div', 'report-grid');
      doses.appendChild(metric('6-MP', r.candidate.mpDaily, 'mg/day'));
      doses.appendChild(metric('MTX', r.candidate.mtxWeekly, 'mg/week'));
      dose.appendChild(doses);
      const note = element('p', 'report-disclaimer',
        'Illustrative change: ' + r.candidate.changePercent +
        '%. Reference 6-MP: ' + r.ref6 + ' mg/day; MTX: ' + r.refM +
        ' mg/week. These values are unvalidated and require clinician review.');
      dose.appendChild(note);
      output.appendChild(dose);
    } else {
      output.appendChild(element('div', 'report-no-dose',
        'No automated dose suggestion. Clinician review required.'));
    }

    output.appendChild(element('p', 'report-disclaimer',
      'Clinical decision-support prototype only. This assessment is not an authorised prescription.'));

    warningsBox.replaceChildren();
    (r.warnings || []).forEach(w => {
      warningsBox.appendChild(element('li', '', w));
    });
    return true;
  }

  function reportError(detail) {
    resultLoading.hidden = true;
    output.hidden = false;
    output.replaceChildren(element('div', 'report-no-dose', detail));
    message.textContent = detail;
  }

  function markSavePending() {
    saveState.classList.remove('unsaved');
    saveState.classList.add('pending');
    saveState.textContent = 'Saving assessment to the restricted history sheet…';
    saveButton.hidden = true;
    saveButton.disabled = true;
  }

  function markSaved(input, when) {
    saved = true;
    saveState.classList.remove('unsaved', 'pending');
    const displayWhen = when ? new Date(when).toLocaleString() : '';
    saveState.textContent = 'Saved automatically · CR ' + input.demoId +
      (displayWhen ? ' · ' + displayWhen : '');
    saveButton.hidden = true;
    saveButton.disabled = true;
  }

  function markSaveFailed(err) {
    saved = false;
    saveState.classList.remove('pending');
    saveState.classList.add('unsaved');
    const detail = (err && err.message) || String(err);
    saveState.textContent = 'NOT SAVED · ' + detail + '. Use Retry save.';
    saveButton.hidden = false;
    saveButton.disabled = false;
    message.textContent = 'Assessment not saved; review the error and retry.';
  }

  /* CALCULATE — SHOW REPORT FIRST, SAVE IN PARALLEL */

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (busy || !validate()) return;
    if (!(window.google && google.script && google.script.run)) {
      message.textContent = 'Open the published Google Apps Script web app.';
      return;
    }

    const input = Object.fromEntries(new FormData(form).entries());
    input._entryId = (window.crypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : (Date.now().toString(36) + '_' +
         Math.random().toString(36).slice(2) + '_' +
         Math.random().toString(36).slice(2));
    lastInput = input;
    const seq = version;
    busy = true;
    calculateButton.disabled = true;
    calculateButton.textContent = 'Preparing assessment…';

    result.style.display = 'block';
    output.hidden = true;
    output.replaceChildren();
    resultLoading.hidden = false;
    loadingText.textContent = 'Preparing assessment…';
    stopBox.hidden = true;
    stopReasons.replaceChildren();
    warningsBox.replaceChildren();
    markSavePending();
    message.textContent = 'Assessment requested.';

    // Scroll straight to the new report — otherwise it is below the long Clinical form.
    requestAnimationFrame(() => {
      if (seq === version) result.scrollIntoView({behavior: 'smooth', block: 'start'});
    });

    let previewFinished = false;
    let previewReady = false;
    let saveFinished = false;

    // Quick read-only preview: this call never writes patient records.
    google.script.run
      .withSuccessHandler(r => {
        previewFinished = true;
        if (seq !== version || (saveFinished && previewReady)) return;
        previewReady = showReport(r, seq, input);
        if (!saveFinished && previewReady) {
          message.textContent = 'Assessment shown; automatic save in progress.';
        }
      })
      .withFailureHandler(err => {
        previewFinished = true;
        if (seq !== version || previewReady) return;
        if (saveFinished) {
          reportError('Assessment unavailable: ' + ((err && err.message) || String(err)));
        } else {
          loadingText.textContent = 'Finishing the assessment…';
        }
      })
      .assessCase(input);

    // Always save the complete assessment once per Calculate click.
    // This retains the existing backend's append-only history and retry ID.
    google.script.run
      .withSuccessHandler(payload => {
        saveFinished = true;
        busy = false;
        calculateButton.disabled = false;
        calculateButton.textContent = 'Calculate Assessment';
        if (seq !== version) return;
        if (!payload || !showReport(payload.assessment, seq, input)) {
          // A malformed response must not appear as a confirmed save.
          markSaveFailed(new Error('Server response was incomplete'));
          return;
        }
        previewReady = true;
        if (payload.saved === true) {
          markSaved(input, payload.savedAt);
          message.textContent = 'Assessment complete.';
        } else {
          markSaveFailed(new Error(payload.saveError || 'Save not confirmed'));
        }
      })
      .withFailureHandler(err => {
        saveFinished = true;
        busy = false;
        calculateButton.disabled = false;
        calculateButton.textContent = 'Calculate Assessment';
        if (seq !== version) return;
        markSaveFailed(err);
        if (previewFinished && !previewReady) {
          reportError('Assessment unavailable. Check your entries and the error above.');
        }
      })
      .assessAndSave(input);
  });

  /* RESET */

  document.getElementById('reset')
    .addEventListener('click', () => {
      form.reset();

      form.querySelectorAll('[data-slider]')
        .forEach(s => {
          s.value =
            form.elements[
              s.dataset.slider
            ].value;
        });

      applyDefaultChoices();
      updateBsa();
      invalidate();
      showTab(0);
    });

  /* RETRY SAVE AFTER AUTOMATIC SAVE FAILURE */

  saveButton.addEventListener('click', () => {
    if (
      !lastInput ||
      busy ||
      saveBusy ||
      saved
    ) return;

    const input =
      Object.assign({}, lastInput);

    const seq = version;

    saveBusy = true;
    saveButton.disabled = true;
    message.textContent = 'Retrying save...';

    google.script.run
      .withSuccessHandler(text => {
        saveBusy = false;

        if (seq !== version) return;

        saved = true;
        saveButton.hidden = true;

        markSaved(input);
        message.textContent = text;
      })
      .withFailureHandler(err => {
        saveBusy = false;

        if (seq !== version) return;

        saveButton.disabled = false;
        saveButton.hidden = false;

        saveState.classList.add('unsaved');

        saveState.textContent =
          'NOT SAVED — ' +
          ((err && err.message) || String(err)) +
          '. Retry save.';

        message.textContent =
          'Save failed — NOT SAVED.';
      })
      .saveAssessment(input);
  });

  /* PRINT */

  document.getElementById('print')
    .addEventListener('click', () => {
      window.print();
    });

})();
</script>

</body>
</html>
