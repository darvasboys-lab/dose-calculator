name: Check PHO ALL source

on:
  pull_request:
    branches: [main]
    paths:
      - Code.gs
      - Index.html
      - scripts/check-source.mjs

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML, JavaScript and assessment interface
        run: node scripts/check-source.mjs
